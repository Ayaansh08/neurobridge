<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="NeuroBridge" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16151A" />
    <meta name="description" content="Practice difficult conversational moments in a realistic, judgment-free social simulation." />
    <title>NeuroBridge - Practice difficult moments before they happen</title>
    <!-- Google Fonts: Fraunces display serif, Public Sans / Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Apply Comfort settings before first paint to prevent flashing -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('neurobridge_settings');
          var s = raw ? JSON.parse(raw) : {};
          var root = document.documentElement;
          if (s.textSize === 'large') {
            root.setAttribute('data-text-size', 'large');
          }
          if (s.contrast === 'high') {
            root.setAttribute('data-contrast', 'high');
          }
          var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var motion = s.motion || (prefersReduced ? 'reduced' : 'standard');
          if (motion === 'reduced') {
            root.setAttribute('data-motion', 'reduced');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
